replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  create: true
  type: ClusterIP
  port: 3000
  headless:
    enabled: false

env:
  DOTNET_URLS: http://+:3000
  ASPNETCORE_URLS: http://*:3000
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.monitoring.svc.cluster.local:4318
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"

ingress:
  enabled: false
  className: ""
  annotations: {}

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http

resources: {}

livenessProbe:
  httpGet:
    path: /swagger
    port: http
readinessProbe:
  httpGet:
    path: /swagger
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

secrets: []

metrics:
  enabled: true
  port: 8080
  interval: 30s
  path: /metrics
