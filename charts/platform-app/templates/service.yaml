{{- if .Values.service.create }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-app.fullname" . }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "platform-app.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if .Values.metrics.enabled}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-app.fullname" . }}-metrics
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.port }}
      protocol: TCP
  selector:
    {{- include "platform-app.selectorLabels" . | nindent 4 }}
{{- end }}
