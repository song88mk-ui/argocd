{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "platform-app.fullname" . }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
    release: prometheus-operator # Required by Prometheus Operator to discover the ServiceMonitor
spec:
  endpoints:
  - path: {{ .Values.metrics.path }}
    port: metrics
{{- if .Values.metrics.relabelings }}
    relabelings:
{{ toYaml .Values.metrics.relabelings | indent 6 }}
{{- end }}
  selector:
    matchLabels:
      {{- include "platform-app.selectorLabels" . | nindent 6 }}
{{- end }}
