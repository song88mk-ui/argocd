{{- range $secret := .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
spec:
spec:
  secretStoreRef:
    name: {{ $secret.secretStoreName | default "parameterstore" }}
    kind: ClusterSecretStore
{{- range $entry := $secret.data }}
  data:
    - secretKey: {{ $entry.key }}
      remoteRef:
        key: {{ $entry.remoteKey }}
        {{- if $entry.remoteProperty }}
        property: {{ $entry.remoteProperty }}
        {{- end }}
{{- end }}
{{- end }}
