{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
spec:
  secretStoreRef:
    name: {{ .secretStoreName | default "parameterstore" }}
    kind: ClusterSecretStore
{{- range .data }}
  data:
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .remoteProperty }}
        property: {{ .remoteProperty }}
        {{- end }}
{{- end }}
{{- end }}
