apiVersion: v1
kind: Service
metadata:
  name: {{ include "bet-genius-app.fullname" . }}
  labels:
    {{- include "bet-genius-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if .Values.metrics.enabled }}
    - port: {{.Values.metrics.port }}
      name: metrics
      targetPort: {{ .Values.metrics.port }}
{{- end }}
  selector:
    {{- include "bet-genius-app.selectorLabels" . | nindent 4 }}
