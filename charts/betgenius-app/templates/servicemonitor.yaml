{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bet-genius-app.fullname" . }}
  labels:
    {{- include "bet-genius-app.labels" . | nindent 4 }}
spec:
  endpoints:
  - interval: {{ .Values.metrics.interval }}
    path: {{ .Values.metrics.path }}
    port: metrics
{{- if .Values.metrics.relabelings }}
    relabelings:
{{ toYaml .Values.metrics.relabelings | indent 6 }}
{{- end }}
  selector:
    matchLabels:
      {{- include "bet-genius-app.selectorLabels" . | nindent 6 }}
{{- end }}
