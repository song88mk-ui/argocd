image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/bg-feed-receiver-api
  tag: latest

fullnameOverride: "bg-feed-receiver-api"

serviceAccount:
  name: "bg-feed-receiver-api-sa"

env:
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  Logging__LogLevel__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  API__RabbitMqAPI__Uri: http://bg-rabbitmq-api:3000
  Logging__LogLevel__Default: Information

replicaCount: 1

resources:
  requests:
    cpu: 300m
    memory: 600Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 5

# The feed is forwarded by the fanout-proxy to both STG and DEV environments
ingress:
  enabled: false
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:172065883315:certificate/995131fd-9d16-42fe-80c8-1fab7e33d6ab
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  hosts:
  - host: bg-feed-receiver-api.dev.song88.com
    paths:
      - path: /
