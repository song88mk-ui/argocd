nameOverride: "oe-sportsbook-service-07"

serviceAccount:
  name: "oe-sportsbook-service-07-sa"

secrets:
  - name: oe-sportsbook-service-07
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password

env:
  MessageBroker__Queue: "q.sb.engine.07"
  MessageBroker__Consumer: "OE.Sportsbook.Service.07"
  MessageBroker__RoutingKey: "r.oe.adapter.#.07"
