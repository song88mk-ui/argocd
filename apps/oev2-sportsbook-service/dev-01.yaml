nameOverride: "oe-sportsbook-service-01"

serviceAccount:
  name: "oe-sportsbook-service-01-sa"

secrets:
  - name: oe-sportsbook-service-01
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password

env:
  MessageBroker__Queue: "q.sb.engine.01"
  MessageBroker__Consumer: "OE.Sportsbook.Service.01"
  MessageBroker__RoutingKey: "r.oe.adapter.#.01"
