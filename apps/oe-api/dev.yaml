image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/oe-api
  tag: latest

fullnameOverride: "oe-api"

serviceAccount:
  name: "api-sa"

secrets:
  - name: api
    data:
    - key: mongodb-connection-string-trading
      remoteKey: /dev/apps/mongodb/connection-string/trading-old
      envVariable: Custom__MongoDB-Trading
    - key: mongodb-connection-string-sportsbook
      remoteKey: /dev/apps/mongodb/connection-string/sportsbook-old
      envVariable: Custom__MongoDB-Sportsbook
    - key: mssql-connection-string-sportsbook
      remoteKey: /dev/apps/mssql/connection-string/sportsbook-old
      envVariable: Custom__Sportsbook
    - key: mssql-connection-string-trading
      remoteKey: /dev/apps/mssql/connection-string/trading-old
      envVariable: Custom__Trading

env:
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  API__RabbitMQAPI: http://oe-rabbitmq-api:3000
  API__PlatformBettingAPI: http://platform-betting-api.platform-apps.svc:3000
  API__PlatformSportsbookAPI: http://platform-sportsbook-api.platform-apps.svc:3000
  API__FastOddsAPI: http://oe-fastodds-api:3000
  Custom__APIKey: xgB3eM5b8FDn9msu
  IsStaging: true

service:
  create: true

metrics:
  enabled: false
