image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/bg-feedlogger-service
  tag: latest

fullnameOverride: "bg-feedlogger-service"

serviceAccount:
  name: "bg-feedlogger-service-sa"

secrets:
  - name: bg-feedlogger-service
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password

env:
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  MessageBroker__Host: rabbitmq-main-cluster.bet-genius-apps.svc
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"
  MessageBroker__Queue: "q.bg.feed-logger"
  Archive__Enabled: true
  Archive__BucketName: song88-dev-bgfeeds
