image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/backoffice-bo-web
  tag: latest

fullnameOverride: "bo-web"

secrets:
  - name: bo-web-service
    data:
    - key: security-api-key
      remoteKey: /prd/apps/auth/security-api-key
      envVariable: API__AuthenticationAPI__Security__APIKey
    - key: jwt-key
      remoteKey: /prd/apps/auth/jwt-key
      envVariable: API__AuthenticationAPI__JWT__Key
    - key: mssql-connection-string-backoffice
      remoteKey: /prd/apps/mssql/connection-string/backoffice
      envVariable: ConnectionStrings__Backoffice
    - key: metabase-secret-key
      remoteKey: /prd/backoffice/metabase/secret-key
      envVariable: Metabase__SecretKey
    - key: metabase-sso-secret-key
      remoteKey: /prd/backoffice/metabase/sso-secret-key
      envVariable: Metabase__SsoSecretKey
    - key: metabase-api-key
      remoteKey: /prd/backoffice/metabase/api-key
      envVariable: Metabase__ApiKey

env:
  Telemetry__Enabled: true
  Telemetry__Environment: prd
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  API__Backoffice__Uri: http://bo-api:3000
  API__Backoffice__Security__ApiKey: 9a8ad73dd129bf49754242e44988b3e7e39f0a05
  API__HubAPI: http://bo-ws-api:3000/bohub
  Region: HK
  SlackWebHoo: "https://hooks.slack.com/workflows/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"
  Metabase__SiteUrl: "https://metabase.prd.song88.com"
  Metabase__DashboardId: "36"
  Metabase__Email: "devops@song88.com"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: prd-eks-external-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:525375333516:certificate/422461ef-9af2-4c32-b9b0-9cda6cfef53d
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: bo.song88.com
    paths:
      - path: /
        pathType: Prefix
