image:
  repository: 525375333516.dkr.ecr.ap-south-1.amazonaws.com/corp-apps-internal-docs
  tag: latest

fullnameOverride: "internal-docs-web"

secrets:
  - name: internal-docs-web
    data:
    - key: github-client-secret
      remoteKey: /prd/song88/internal-docs/client-secret
      envVariable: GITHUB_CLIENT_SECRET
    - key: github-client-id
      remoteKey: /prd/song88/internal-docs/client-id
      envVariable: GITHUB_CLIENT_ID

env:
  OAUTH2_PROXY_COOKIE_SECRET: vsJjHpRma0s5EeLVVn7i2kUBs-q43xZgr9MAWMF8OXE=
  OAUTH2_PROXY_REDIRECT_URL: https://docs.s88platform.com

livenessProbe:
readinessProbe:

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: prd-eks-external-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:525375333516:certificate/1ebf1c9f-d0b5-4f18-9be3-cfb6589a2360
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: docs.s88platform.com
    paths:
      - path: /
        pathType: Prefix
