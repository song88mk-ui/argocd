image:
  repository: 525375333516.dkr.ecr.ap-south-1.amazonaws.com/backoffice-websocket-service
  tag: latest

fullnameOverride: "bo-ws-service"

service:
  create: false
livenessProbe:
readinessProbe:

secrets:
  - name: websocket-service
    data:
    - key: rabbitmq-username
      remoteKey: /prd/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /prd/apps/rabbitmq/password
      envVariable: MessageBroker__Password

env:
  Telemetry__Enabled: true
  Telemetry__Environment: prd
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  MessageBroker__Host: b-bfc99daf-fb92-4742-af20-8bcf6bd1f118.mq.ap-east-1.on.aws
  MessageBroker__Port: 5671
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"
  MessageBroker__Queue: "q.bo.websocket"
  MessageBroker__Consumer: "BO.WebSocket.Service"
  MessageBroker__RoutingKey: "r.oe.sb.engine.onoddschange|r.oe.sb.engine.onbetstopfixture|r.oe.sb.engine.onbetstopglobal|r.oe.bm.engine.notifications"
  MessageBroker__IsPriority: true
  MessageBroker__IsExclusive: true
  Custom__WebSocketAPI: "http://bo-ws-api:3000/bohub"
  Custom__AsianClientCodes: "G02,TSO,S88"
  API__PlatformAPI__Uri: "http://platform-api.platform.svc:3000"
  API__PlatformAPI__APIKey: "04a4cfdd40428ad"
  API__PlatformSportsbook__Uri: "http://sportsbook-api.platform.svc:3000"
