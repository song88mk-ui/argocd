image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/backoffice-websocket-api
  tag: latest

fullnameOverride: "bo-ws-api"

serviceAccount:
  name: "websocket-api-sa"

env:
  Telemetry__Enabled: true
  Telemetry__Environment: stg
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: stg-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:172065883315:certificate/511ed09e-124c-4f7d-8974-561b1907b29e
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: bo-ws.stg.song88.com
    paths:
      - path: /
        pathType: Prefix
