image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/platform-client-api
  tag: latest

fullnameOverride: "platform-client-api"

serviceAccount:
  name: "platform-client-api-sa"

secrets:
  - name: platform-client-api
    data:
    - key: mssql-connection-string
      remoteKey: /dev/apps/mssql/connection-string/platform-old
      envVariable: ConnectionStrings__Platform

env:
  API__PlatformSportsbookAPI: http://platform-sportsbook-api:3000
  API__MTSAuthAPI: https://mts-auth-ci.betradar.com
  API__MTSCCFAPI: https://mts-api-ci.betradar.com
  Telemetry__Enabled: true

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:418541840646:certificate/ed922e6e-6b95-4fdf-a10c-1a7253d35313
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /swagger

  hosts:
  - host: client-api.dev.song88.com
    paths:
      - path: /
        pathType: Prefix
