image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/of-client-api
  tag: latest

fullnameOverride: "client-api"

serviceAccount:
  name: "client-api-sa"

env:
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  API__PlatformAPI__Uri: http://platform-api.platform.svc:3000
  API__OFBettingAPI__Uri: http://betting-api:3000
  API__OFSportsbookAPI__Uri: http://sportsbook-api:3000
  Telemetry__Enabled: true

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:418541840646:certificate/ed922e6e-6b95-4fdf-a10c-1a7253d35313
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /swagger

  hosts:
  - host: ofclient-api.dev.song88.com
    paths:
      - path: /
        pathType: Prefix
