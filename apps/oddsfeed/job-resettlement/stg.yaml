image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/of-job-resettlement
  tag: latest

fullnameOverride: "job-resettlement"

serviceAccount:
  name: "job-resettlement-sa"

secrets:
  - name: job-resettlement-retry
    data:
    - key: rabbitmq-username
      remoteKey: /stg/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /stg/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-platform
      remoteKey: /stg/apps/mssql/connection-string/platform
      envVariable: ConnectionStrings__Platform

env:
  Telemetry__Environment: stg
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  Logging__LogLevel__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  MessageBroker__Host: b-e244ede6-0d6a-4c12-be31-90e96fa9126b.mq.ap-south-1.on.aws
  MessageBroker__Port: 5671
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"

livenessProbe:
readinessProbe:
