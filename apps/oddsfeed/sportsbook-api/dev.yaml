image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/of-sportsbook-api
  tag: latest

fullnameOverride: "of-sportsbook-api"

serviceAccount:
  name: "of-sportsbook-api-sa"

secrets:
  - name: of-sportsbook-api
    data:
    - key: mongodb-connection-string-sportsbook
      remoteKey: /dev/apps/mongodb-instance/connection-string/sportsbook
      envVariable: ConnectionStrings__MongoDB-Sportsbook
    - key: mssql-connection-string-sportsbook
      remoteKey: /dev/apps/mssql/connection-string/sportsbook
      envVariable: ConnectionStrings__Sportsbook

env:
  Telemetry__Environment: dev
  Telemetry__Enabled: true
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  Logging__LogLevel__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  API__RabbitMQAPI__Uri: http://rabbitmq-api:3000
