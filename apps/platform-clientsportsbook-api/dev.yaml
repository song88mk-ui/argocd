image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/platform-clientsportsbook-api
  tag: latest

fullnameOverride: "platform-clientsportsbook-api"

serviceAccount:
  name: "platform-clientsportsbook-api-sa"

secrets:
  - name: platform-clientsportsbook-api
    data:
    - key: mssql-connection-string-platform
      remoteKey: /dev/apps/mssql/connection-string/platform-old
      envVariable: ConnectionStrings__Platform
    - key: redis-connection-string-krj
      remoteKey: /dev/apps/redis/connection-string/krj
      envVariable: ConnectionStrings__RedisInstances__0__KRJ
    - key: redis-connection-string-tso
      remoteKey: /dev/apps/redis/connection-string/tso
      envVariable: ConnectionStrings__RedisInstances__1__TSO

env:
  API__SportsbookAPI: http://platform-sportsbook-api:3000
  API__RabbitMQAPI: http://platform-rabbitmq-api:3000
  Telemetry__Enabled: true

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:418541840646:certificate/ed922e6e-6b95-4fdf-a10c-1a7253d35313
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /v1/probe

  hosts:
  - host: clientplatform-api.dev.song88.com
    paths:
      - path: /
        pathType: Prefix

livenessProbe:
  httpGet:
    path: /v1/probe
readinessProbe:
  httpGet:
    path: /v1/probe
