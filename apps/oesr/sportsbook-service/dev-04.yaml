fullnameOverride: "sportsbook-service-04"

serviceAccount:
  name: "sportsbook-service-04-sa"

secrets:
  - name: sportsbook-service-04
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mongodb-connection-string-trading
      remoteKey: /dev/apps/mongodb/connection-string/trading-old
      envVariable: Custom__MongoDB-Trading
    - key: mongodb-connection-string-sportsbook
      remoteKey: /dev/apps/mongodb/connection-string/trading-old
      envVariable: Custom__MongoDB-Sportsbook

env:
  MessageBroker__Queue: "q.sb.engine.04"
  MessageBroker__Consumer: "OE.Engine.Sportsbook.04"
  MessageBroker__RoutingKey: "r.oe.adapter.#.04"

metrics:
  enabled: true
