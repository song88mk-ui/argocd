image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/platform-job-forexeur
  tag: latest

nameOverride: "platform-job-forexeur"

serviceAccount:
  name: "platform-job-forexeur-sa"

secrets:
  - name: platform-job-forexeur
    data:
    - key: mssql-connection-string
      remoteKey: /dev/apps/mssql/connection-string/platform-old
      envVariable: ConnectionStrings__Platform

service:
  create: false

# TODO:  create probes for services
livenessProbe:
readinessProbe:

metrics:
  enabled: true
