image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/platform-betting-api
  tag: latest

nameOverride: "platform-betting-api"

serviceAccount:
  name: "platform-betting-api-sa"

secrets:
  - name: platform-betting-api
    data:
    - key: mssql-connection-string
      remoteKey: /dev/apps/mssql/connection-string/betting
      envVariable: ConnectionStrings__Betting

env:
  API__RabbitMQAPI: http://platform-rabbitmq-api:3000
  API__PlatformSportsbookAPI: http://platform-sportsbook-api:3000
  Custom__IsMTSEnabled: false
