  tag: latest

fullnameOverride: "job-boostedoddscap"

service:
  create: false

serviceAccount:
  name: "job-boostedoddscap-sa"

secrets:
  - name: job-boostedoddscap
    data:
    - key: rabbitmq-username
      remoteKey: /prd/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /prd/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-trading
      remoteKey: /prd/apps/mssql/connection-string/trading
      envVariable: ConnectionStrings__Trading
    - key: mssql-connection-string-backoffice
