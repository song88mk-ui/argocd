image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/oev2-translation-service
  tag: latest

fullnameOverride: "translation-service"

serviceAccount:
  name: "translation-service-sa"

secrets:
  - name: translation-service
    data:
    - key: rabbitmq-username
      remoteKey: /prd/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /prd/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-backoffice
      remoteKey: /prd/apps/mssql/connection-string/backoffice
      envVariable: ConnectionStrings__Backoffice
    - key: mssql-connection-string-translation
      remoteKey: /prd/apps/mssql/connection-string/translation
      envVariable: ConnectionStrings__Translation
    - key: mongodb-connection-string-sportsbook
      remoteKey: /prd/apps/mongodb-instance/connection-string/sportsbook
      envVariable: Custom__MongoDB-Sportsbook

env:
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  MessageBroker__Host: b-bfc99daf-fb92-4742-af20-8bcf6bd1f118.mq.ap-east-1.on.aws
  MessageBroker__Port: 5671
  # Cap in-flight deliveries: the 1000 default let the 30-min consumer ack timeout expire on
  # buffered messages during backlogs, causing mass redelivery loops (2026-07-15 incident).
  MessageBroker__PrefetchCount: "10"
  Custom__DbContextTimeout: 180
  Custom__Cleanup__Enabled: true
  Custom__Cleanup__IntervalMinutes: 60
  Custom__Cleanup__StartupDelaySeconds: 60
  Custom__Cleanup__RetentionDays: 30
  Custom__Cleanup__BatchSize: 2000
  Custom__Translation__SeedActiveSnapshot: true
  Custom__Translation__CacheSeed: true
  # GM-784: the legacy-TranslationCache bridge copies ZH into TranslationCache2 and marks the
  # row PROCESSED = 1 in SQL only. update.py's worklist is PROCESSED = 0, so nothing ever
  # announces those rows downstream and the names render English on the sportsbook until a
  # Backoffice re-save or a service restart. The image defaults this to true; keep it off
  # until the bridge is removed from the image entirely.
  Custom__Translation__CacheBackfill: false

metrics:
  enabled: false

livenessProbe:
readinessProbe:
