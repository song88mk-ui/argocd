fullnameOverride: "sportsbook-service-07"

serviceAccount:
  name: "sportsbook-service-07-sa"

secrets:
  - name: sportsbook-service-07
    data:
    - key: rabbitmq-username
      remoteKey: /stg/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /stg/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mongodb-connection-string-sportsbook
      remoteKey: /stg/apps/mongodb/connection-string/sportsbook
      envVariable: Custom__MongoDB-Sportsbook

env:
  MessageBroker__Queue: "q.sb.engine.07"
  MessageBroker__Consumer: "OE.Sportsbook.Service.07"
  MessageBroker__RoutingKey: "r.oe.adapter.#.07"
