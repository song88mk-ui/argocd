fullnameOverride: "sportsbook-service-09"

serviceAccount:
  name: "sportsbook-service-09-sa"

secrets:
  - name: sportsbook-service-09
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mongodb-connection-string-sportsbook
      remoteKey: /dev/apps/mongodb/connection-string/sportsbook
      envVariable: Custom__MongoDB-Sportsbook

env:
  MessageBroker__Queue: "q.sb.engine.09"
  MessageBroker__Consumer: "OE.Sportsbook.Service.09"
  MessageBroker__RoutingKey: "r.oe.adapter.#.09"
