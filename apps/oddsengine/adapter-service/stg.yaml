image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/oev2-adapter-service
  tag: latest

fullnameOverride: "adapter-service"

service:
  create: false

serviceAccount:
  name: "adapter-service-sa"

secrets:
  - name: adapter-service
    data:
    - key: rabbitmq-username
      remoteKey: /stg/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /stg/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-translation
      remoteKey: /stg/apps/mssql/connection-string/translation
      envVariable: ConnectionStrings__Translation
    - key: mssql-connection-string-trading
      remoteKey: /stg/apps/mssql/connection-string/trading
      envVariable: ConnectionStrings__Trading
    - key: internal-api-key
      remoteKey: /stg/apps/internal-api-key
      envVariable: API__APIKey

env:
  Telemetry__Enabled: true
  Telemetry__Environment: stg
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  MessageBroker__Host: b-e244ede6-0d6a-4c12-be31-90e96fa9126b.mq.ap-south-1.on.aws
  MessageBroker__Port: 5671
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"
  MessageBroker__Queue: "q.oe.adapter"
  MessageBroker__Consumer: "OE.Adapter.Service"
  MessageBroker__RoutingKey: "r.bg.receiver.#|r.uof.#"
  API__PlatformAPI: "http://platform-api.platform.svc:3000"

livenessProbe:
readinessProbe:
