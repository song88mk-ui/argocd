---
fullnameOverride: "websocket-service-oge"

secrets:
  - name: websocket-service-oge
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password

env:
  MessageBroker__Queue: "q.sb.engine.websocket.OGE"
  MessageBroker__Consumer: "OE.Engine.WebSocket.OGE"
  MessageBroker__RoutingKey: "r.oe.sb.engine.onoddschange|r.oe.sb.engine.onbetstopfixture|r.oe.sb.engine.onbetstopglobal|r.bet.betstatus.oge|r.bet.cashoutchange.oge|r.wallet.oge|r.oe.sb.engine.onvisitfavorites.oge|r.oe.sb.engine.onvisitboostedfixtures.oge|r.oe.sb.engine.onmarketsortorderchange.oge"
  Custom__ClientId: "0738EF38-39E3-4405-A202-D466C6EEB7C2"
  Custom__ClientCode: "OGE"


