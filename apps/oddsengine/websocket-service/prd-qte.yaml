---
fullnameOverride: "websocket-service-qte"

secrets:
  - name: websocket-service-qte
    data:
    - key: rabbitmq-username
      remoteKey: /prd/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /prd/apps/rabbitmq/password
      envVariable: MessageBroker__Password

env:
  MessageBroker__Queue: "q.sb.engine.websocket.QTE"
  MessageBroker__Consumer: "OE.Engine.WebSocket.QTE"
  MessageBroker__RoutingKey: "r.oe.sb.engine.onoddschange|r.oe.sb.engine.onbetstopfixture|r.oe.sb.engine.onbetstopglobal|r.bet.betstatus.qte|r.bet.cashoutchange.qte|r.wallet.qte|r.oe.sb.engine.onvisitfavorites.qte|r.oe.sb.engine.onvisitboostedfixtures.qte|r.oe.sb.engine.onmarketsortorderchange.qte"
  Custom__ClientId: "D9D3ADD2-DAA0-49A4-2573-08DD934F4819"
  Custom__ClientCode: "QTE"
