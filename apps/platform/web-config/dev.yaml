image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-web-config
  tag: latest

fullnameOverride: "platform-web-config"

serviceAccount:
  name: "platform-web-config-sa"

livenessProbe:
  httpGet:
    path: /

readinessProbe:
  httpGet:
    path: /

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: dev-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:172065883315:certificate/995131fd-9d16-42fe-80c8-1fab7e33d6ab
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: platform-web-config.dev.song88.com
    paths:
      - path: /
        pathType: Prefix

metrics:
  enabled: false
