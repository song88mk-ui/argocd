image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/client-checklist-web
  tag: latest

fullnameOverride: "checklist-web"

serviceAccount:
  name: "checklist-web-sa"

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:418541840646:certificate/1d165e50-a106-46ad-90b5-d93cbc8b2bca
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: cl.dev.song88.com
    paths:
      - path: /
        pathType: Prefix

metrics:
  enabled: false
