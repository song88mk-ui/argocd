image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/client-checklist-web
  tag: latest

fullnameOverride: "checklist-web"

serviceAccount:
  name: "checklist-web-sa"

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: stg-jmj-bet-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:172065883315:certificate/23b5b510-cb69-45a8-a963-703ae965d059
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: start.stg.jmj.bet
    paths:
      - path: /
        pathType: Prefix

metrics:
  enabled: false
