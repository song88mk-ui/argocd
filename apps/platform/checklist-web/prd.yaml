image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/client-checklist-web
  tag: latest

fullnameOverride: "checklist-web"

serviceAccount:
  name: "checklist-web-sa"

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: prd-jmj-bet-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:525375333516:certificate/774b1b69-f97a-4f85-8e87-43e7e8d1c51d
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: start.jmj.bet
    paths:
      - path: /
        pathType: Prefix

metrics:
  enabled: false
