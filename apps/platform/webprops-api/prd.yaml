image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/platform-webprops-api
  tag: latest

fullnameOverride: "platform-webprops-api"

serviceAccount:
  name: "webprops-api-sa"

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
readinessProbe:
  httpGet:
    path: /healthz
    port: 3000

env:
  PORT: 3000
  BUCKET_NAME: song88-prd-webprops
  CACHE_API_KEY: "s@ng88"

metrics:
  enabled: false

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: prd-eks-external-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:525375333516:certificate/422461ef-9af2-4c32-b9b0-9cda6cfef53d
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz

  hosts:
  - host: platform-webprops.song88.com
    paths:
      - path: /
        pathType: Prefix
