---
image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-clientplatform-api
  tag: latest

fullnameOverride: "clientplatform-api"

serviceAccount:
  name: "clientplatform-api-sa"

replicaCount: 2

resources:
  requests:
    cpu: 300m
    memory: 600Mi

env:
  Telemetry__Enabled: true
  Telemetry__Environment: stg
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  API__PlatformAPI: http://platform-api:3000
  API__PlatformAPIReadonly: http://platform-api-ro:3000

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: stg-eks-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:172065883315:certificate/a6c41251-e9d8-4647-96d0-b06a5c93525c
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /v1/probe

  hosts:
  - host: client-api.stg.song88.com
    paths:
      - path: /
        pathType: Prefix
