image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-job-forexeur
  tag: latest

fullnameOverride: "job-forexeur"

serviceAccount:
  name: "job-forexeur-sa"

metrics:
  enabled: false

secrets:
  - name: job-forexeur
    data:
    - key: mssql-connection-string-platform
      remoteKey: /dev/apps/mssql/connection-string/platform
      envVariable: ConnectionStrings__Platform

env:
  Telemetry__Enabled: true
  Telemetry__Environment: dev
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  OpenExchangeRates__AppId: a19c493bff274bc0821527034b6274d8
  OpenExchangeRates__BaseCurrency: EUR

# TODO:  create probes for services
livenessProbe:
readinessProbe:
