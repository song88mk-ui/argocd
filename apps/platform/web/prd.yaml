image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/platform-web
  tag: latest

fullnameOverride: "platform-web"

serviceAccount:
  name: "platform-web-sa"

secrets:
  - name: web
    data:
    - key: web-og-private-key
      remoteKey: /prd/apps/web/og/private-key
      envVariable: Custom__OrientalGaming__PrivateAPIKey

resources:
  requests:
    cpu: 100m
    memory: 900Mi

env:
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"
  Telemetry__Environment: prd
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  Logging__LogLevel__System.Net.Http.HttpClient.IPlatformRepository: Warning
  Logging__LogLevel__System.Net.Http.HttpClient.platform-api: Warning
  Logging__LogLevel__System.Net.Http.HttpClient.Default: Warning
  API__PlatformAPI: http://platform-api:3000
  API__PlatformWebsocketAPI: http://websocket-api:3000/platform
  Config__BaseURL: http://platform-webprops-api:3000
  CDN__BaseURL: https://assets.song88.com
  Custom__UseMessagePack: true
  Custom__MaximumConnections: 300
  Custom__MaintenanceConfigFile: Configs/maintenance.json
  Custom__MaintenanceWhitelistedIPs__0: "3.7.178.117"
  Custom__MaintenanceWhitelistedIPs__1: "13.204.106.185"
  Custom__MaintenanceWhitelistedIPs__2: "95.40.172.189"
  Custom__Layout__Version: 0
  Custom__OrientalGaming__HighCurrenciesAsString: IDRK,VNDK,MMKK,INRK,UZSK

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: prd-eks-external-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:525375333516:certificate/422461ef-9af2-4c32-b9b0-9cda6cfef53d
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/target-group-attributes: >-
      stickiness.enabled=true,
      stickiness.type=lb_cookie,
      stickiness.lb_cookie.duration_seconds=86400

  hosts:
  - host: sb.song88.com
    paths:
      - path: /
        pathType: Prefix

metrics:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi

