---
# auth is on separate repo, but included as part of the platform services
image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-auth-api
  tag: latest

fullnameOverride: "auth-api"

serviceAccount:
  name: "auth-api-sa"

secrets:
  - name: auth-api
    data:
    - key: security-api-key
      remoteKey: /stg/apps/auth/security-api-key
      envVariable: Security__ApiKey
    - key: jwt-key
      remoteKey: /stg/apps/auth/jwt-key
      envVariable: JWT__Key
    - key: mssql-connection-string-auth
      remoteKey: /stg/apps/mssql/connection-string/auth
      envVariable: Context__Auth

replicaCount: 2

resources:
  requests:
    cpu: 300m
    memory: 600Mi

env:
  Telemetry__Enabled: true
  Telemetry__Environment: stg
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  Logging__LogLevel__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  JWT__Issuer: bo.auth.api

livenessProbe:
  httpGet:
    path: /healthz
readinessProbe:
  httpGet:
    path: /healthz
