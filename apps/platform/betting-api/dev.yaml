image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/platform-betting-api
  tag: latest

fullnameOverride: "betting-api"

serviceAccount:
  name: "betting-api-sa"

secrets:
  - name: betting-api
    data:
    - key: mssql-connection-string-betting
      remoteKey: /dev/apps/mssql/connection-string/betting
      envVariable: ConnectionStrings__Betting
    - key: custom-gts-client-id
      remoteKey: /dev/apps/platform/gts-client-id
      envVariable: Custom__GTSClientID
    - key: custom-gts-client-secret
      remoteKey: /dev/apps/platform/gts-client-secret
      envVariable: Custom__GTSClientSecret

env:
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  Logging__LogLevel__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  API__RabbitMQAPI: http://rabbitmq-api:3000
  API__PlatformSportsbookAPI: http://sportsbook-api:3000
  API__GTSAuthAPI: https://uat.auth.geniussports.com
  API__GTSAPI: https://uat.auth.geniussports.com
  Custom__IsProviderEnabled: true
  Custom__GTSBookmakerId: 10939
  Custom__IsMTSEnabled: false
