image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-placement-service
  tag: latest

fullnameOverride: "placement-service"

serviceAccount:
  name: "placement-service-sa"

secrets:
  - name: placement-service
    data:
    - key: rabbitmq-username
      remoteKey: /dev/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /dev/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-betting
      remoteKey: /dev/apps/mssql/connection-string/betting
      envVariable: ConnectionStrings__Betting
    - key: custom-gts-client-id
      remoteKey: /dev/apps/platform/gts-client-id
      envVariable: Custom__GTSClientID
    - key: custom-gts-client-secret
      remoteKey: /dev/apps/platform/gts-client-secret
      envVariable: Custom__GTSClientSecret

env:
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"
  Telemetry__Environment: dev
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  MessageBroker__Host: rabbitmq-main-cluster
  MessageBroker__Port: 5672
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"
  MessageBroker__IsPriority: "true"
  MessageBroker__Consumer: "Platform.Placement.Service"
  MessageBroker__RoutingKey: "r.bet.placement"
  MessageBroker__Queue: q.bet.placement
  MessageBroker__PrefetchCount: 1000
  API__GTSAuthAPI: "https://uat.auth.geniussports.com"
  API__GTSAPI: "https://gw1.uat.risk.api.geniussports.com"
  API__MTSAuthAPI: "https://mts-auth-ci.betradar.com"
  API__MTSMaxStakeAPI: "https://mts-api-ci.betradar.com"
  Custom__IsProviderEnabled: true
  Custom__TestBetClientCodes: "QTE,KRJ,GSA,OGE,G01,G02"
  Custom__GTSBookmakerId: 10939

livenessProbe:
readinessProbe:
