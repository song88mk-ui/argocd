image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-web-mockup
  tag: latest

fullnameOverride: "platform-web-mockup"

serviceAccount:
  name: "platform-web-mockup-sa"

env:
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"
  Telemetry__Environment: dev
  Logging__Console__IncludeScopes: true
  Logging__Console__FormatterName: "json"
  Logging__Console__FormatterOptions__SingleLine: true
  Logging__Console__FormatterOptions__UseUtcTimestamp: true
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-dd HH:mm:ss.fff Z"
  API__PlatformAPI: http://xplatform-api:3000
  API__PlatformWebsocketAPI: http://xwebsocket-api:3000
  Config__BaseURL: http://xplatform-web-config:3000
  CDN__BaseURL: https://assets.dev.song88.com
  Custom__Layout__Version: 0

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-eks-alb
    alb.ingress.kubernetes.io/group.name: dev-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:172065883315:certificate/995131fd-9d16-42fe-80c8-1fab7e33d6ab
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /

  hosts:
  - host: sb-demo.dev.song88.com
    paths:
      - path: /
        pathType: Prefix

metrics:
  enabled: false
