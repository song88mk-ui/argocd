image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/platform-websocket-api
  tag: latest

fullnameOverride: "websocket-api"

serviceAccount:
  name: "websocket-api-sa"

# NOTE: Excessive logging. Can be removed once the logs are cleared.
podAnnotations:
  fluentbit.io/exclude: "true"

secrets:
  - name: websocket-api
    data:
    - key: mssql-connection-string-platform
      remoteKey: /prd/apps/mssql/connection-string/platform
      envVariable: ConnectionStrings__Platform

env:
  Telemetry__Enabled: true
  Telemetry__Environment: prd
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  Custom__UseMessagePack: true

resources:
  requests:
    cpu: 1
    memory: 600Mi

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: prd-eks-external-alb
    alb.ingress.kubernetes.io/group.name: apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:525375333516:certificate/422461ef-9af2-4c32-b9b0-9cda6cfef53d
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /swagger

  hosts:
  - host: websocket-api.song88.com
    paths:
      - path: /
        pathType: Prefix
