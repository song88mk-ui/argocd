image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/platform-cashout-service
  tag: latest

fullnameOverride: "cashout-service"

serviceAccount:
  name: "cashout-service-sa"

metrics:
  enabled: false

secrets:
  - name: cashout-service
    data:
    - key: rabbitmq-username
      remoteKey: /prd/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /prd/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-betting
      remoteKey: /prd/apps/mssql/connection-string/betting
      envVariable: ConnectionStrings__Betting
    - key: custom-gts-client-id
      remoteKey: /prd/apps/platform/gts-client-id
      envVariable: Custom__GTSClientID
    - key: custom-gts-client-secret
      remoteKey: /prd/apps/platform/gts-client-secret
      envVariable: Custom__GTSClientSecret

env:
  Telemetry__Enabled: "true"
  Telemetry__Environment: prd
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  MessageBroker__Host: b-bfc99daf-fb92-4742-af20-8bcf6bd1f118.mq.ap-east-1.on.aws
  MessageBroker__Port: 5671
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"
  MessageBroker__PrefetchCount: 1000
  Custom__IsMTSEnabled: false
  Custom__Delay: 7000
  API__PlatformBettingAPI: http://betting-api:3000
  API__GTSAuthAPI: "https://auth.geniussports.com"
  API__GTSAPI: "https://gw1.risk.api.geniussports.com"

# TODO:  create probes for services
livenessProbe:
readinessProbe:
