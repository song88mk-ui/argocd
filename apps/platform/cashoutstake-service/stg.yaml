image:
  repository: 172065883315.dkr.ecr.ap-south-1.amazonaws.com/platform-cashoutstake-service
  tag: latest

fullnameOverride: "cashoutstake-service"

serviceAccount:
  name: "cashoutstake-service-sa"

secrets:
  - name: cashoutstake-service
    data:
    - key: rabbitmq-username
      remoteKey: /stg/apps/rabbitmq/username
      envVariable: MessageBroker__Username
    - key: rabbitmq-password
      remoteKey: /stg/apps/rabbitmq/password
      envVariable: MessageBroker__Password
    - key: mssql-connection-string-betting
      remoteKey: /stg/apps/mssql/connection-string/betting
      envVariable: ConnectionStrings__Betting
    - key: mssql-connection-string-sportsbook
      remoteKey: /stg/apps/mssql/connection-string/sportsbook
      envVariable: ConnectionStrings__Sportsbook

env:
  Telemetry__Enabled: "true"
  Telemetry__Environment: stg
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  MessageBroker__Host: b-e244ede6-0d6a-4c12-be31-90e96fa9126b.mq.ap-south-1.on.aws
  MessageBroker__Port: 5671
  MessageBroker__VirtualHost: "/"
  MessageBroker__Exchange: "e.central"

livenessProbe:
readinessProbe:
