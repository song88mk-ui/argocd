image:
  repository: 418541840646.dkr.ecr.ap-south-1.amazonaws.com/platform-sportsbook-api
  tag: latest

fullnameOverride: "sportsbook-api"

serviceAccount:
  name: "sportsbook-api-sa"

secrets:
  - name: sportsbook-api
    data:
    - key: mongodb-connection-string-sportsbook
      remoteKey: /dev/apps/mongodb/connection-string/sportsbook
      envVariable: ConnectionStrings__MongoDB-Sportsbook
    - key: mssql-connection-string-sportsbook
      remoteKey: /dev/apps/mssql/connection-string/sportsbook
      envVariable: ConnectionStrings__Sportsbook
    - key: betgenius-user
      remoteKey: /dev/apps/betgenius/user
      envVariable: API__BetGenius__User
    - key: betgenius-password
      remoteKey: /dev/apps/betgenius/password
      envVariable: API__BetGenius__Password
    - key: betgenius-key
      remoteKey: /dev/apps/betgenius/key
      envVariable: API__BetGenius__Key

env:
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"
  Telemetry__Environment: dev
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  API__RabbitMQAPI: http://rabbitmq-api:3000
  API__BetGenius__Uri: "https://api.geniussports.com/"
  API__BetGenius__Env: "UAT"
