image:
  repository: 525375333516.dkr.ecr.ap-east-1.amazonaws.com/platform-sportsbook-api
  tag: latest

fullnameOverride: "sportsbook-api"

serviceAccount:
  name: "sportsbook-api-sa"

service:
  headless:
    enabled: true

replicaCount: 1

resources:
  requests:
    cpu: 400m
    memory: 600M

secrets:
  - name: sportsbook-api
    data:
    - key: mongodb-connection-string-sportsbook
      remoteKey: /prd/apps/mongodb-instance/connection-string/sportsbook
      envVariable: ConnectionStrings__MongoDB-Sportsbook
    - key: mssql-connection-string-sportsbook
      remoteKey: /prd/apps/mssql/connection-string/sportsbook
      envVariable: ConnectionStrings__Sportsbook
    - key: betgenius-user
      remoteKey: /prd/apps/betgenius/user
      envVariable: Custom__BetGenius__User
    - key: betgenius-password
      remoteKey: /prd/apps/betgenius/password
      envVariable: Custom__BetGenius__Password
    - key: betgenius-key
      remoteKey: /prd/apps/betgenius/key
      envVariable: Custom__BetGenius__Key
    - key: mssql-connection-string-translation
      remoteKey: /prd/apps/mssql/connection-string/translation
      envVariable: ConnectionStrings__Translation

livenessProbe: {}
readinessProbe: {}
      
env:
  Custom__Translation__UseContentKey: false
  Telemetry__Enabled: "true"
  Telemetry__MetricsPort: "8080"
  Telemetry__Environment: prd
  Serilog__WriteTo__0__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
  Serilog__MinimumLevel__Override__System.Net.Http.HttpClient.OtlpTraceExporter: "Warning"
  Custom__RabbitMQAPI: http://rabbitmq-api:3000
  Custom__BetGenius__Uri: "https://api.geniussports.com/"
  Custom__BetGenius__Env: "PRODPRM"
  Custom__HasReplica: false
